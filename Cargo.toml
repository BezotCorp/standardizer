[package]
name = "standardizer"
version = "1.0.1"
edition = "2024"
description = "Check or fix the conformance of files in a Git repository by dispatching them to rustfmt or Biome"
license = "Apache-2.0"
repository = "https://github.com/BezotCorp/standardizer"
readme = "README.md"
keywords = ["formatter", "git", "rustfmt", "biome", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**",
  "LICENSE",
  "data/routing.bin",
  "data/routing.ron",
  "data/tools.bin",
  "data/tools.ron",
]

[features]
default = ["embedded-routing", "embedded-tools"]
routing-source = [
  "dep:ron",
  "dep:serde",
  "standardizer-common/source",
  "embedded-tools",
]
tools-source = ["dep:ron", "dep:serde"]
embedded-routing = []
embedded-tools = []

[dependencies]
semver = "1"
arboard = "3"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
  "system_fonts",
  "wayland",
  "x11",
] }
bincode-next = "3"
standardizer-common = { version = "2", path = "../libraries/common", features = ["decode"] }
ron = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
