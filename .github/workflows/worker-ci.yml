name: Worker CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate data
        shell: bash
        run: ./scripts/generate-data.sh

      - name: Standardizer
        run: cargo run --locked -- check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Clippy routing source
        run: cargo clippy --locked --all-targets --no-default-features --features routing-source -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Check package publication
        run: cargo publish --dry-run --locked
