name: Worker CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1

      - name: Check source integrity
        shell: bash
        run: ./scripts/check-package-integrity.sh --before-generation

      - name: Generate data
        shell: bash
        run: ./scripts/generate-data.sh

      - name: Standardizer
        run: cargo run --locked -- check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Clippy routing source
        run: cargo clippy --locked --all-targets --no-default-features --features routing-source -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Check package publication
        shell: bash
        run: |
          ./scripts/check-package-integrity.sh
          cargo publish --dry-run --locked --allow-dirty
