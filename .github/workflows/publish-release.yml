name: Publish release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'bezotcorp-release-bot[bot]'

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p standardizer --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir package
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/standardizer.exe" package/
          else
            cp "target/${{ matrix.target }}/release/standardizer" package/
          fi
          cp README.md LICENSE package/
          tar -czf "standardizer-${{ matrix.target }}.tar.gz" -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: standardizer-${{ matrix.target }}
          path: standardizer-${{ matrix.target }}.tar.gz

  publish:
    name: Publish and synchronize release
    needs: build
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'bezotcorp-release-bot[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BEZOTCORP_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.BEZOTCORP_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure release bot
        run: |
          git config user.name "bezotcorp-release-bot[bot]"
          git config user.email "bezotcorp-release-bot[bot]@users.noreply.github.com"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Read and verify release version
        id: release
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            sed -n \
              's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              product/Cargo.toml |
            head -n 1
          )"

          if [[ -z "$VERSION" ]]; then
            echo "Unable to read the package version from Cargo.toml."
            exit 1
          fi

          TAG="v${VERSION}"
          EXPECTED_BRANCH="release/${TAG}"

          if [[ "$RELEASE_BRANCH" != "$EXPECTED_BRANCH" ]]; then
            echo "Release branch mismatch."
            echo "Expected: ${EXPECTED_BRANCH}"
            echo "Actual:   ${RELEASE_BRANCH}"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attempt crates.io publication
        id: crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set +e

          cargo publish --dry-run --locked -p standardizer-common -p standardizer
          DRY_RUN_STATUS=$?

          if [[ "$DRY_RUN_STATUS" -eq 0 ]]; then
            cargo publish --locked -p standardizer-common -p standardizer
            PUBLISH_STATUS=$?
          else
            PUBLISH_STATUS="$DRY_RUN_STATUS"
          fi

          if [[ "$PUBLISH_STATUS" -eq 0 ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Crate publication succeeded."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::crates.io publication failed. GitHub release processing will continue."
          fi

          exit 0

      - name: Create or verify Git tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_TAG_SHA="$(
            git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" |
            awk '{print $1}'
          )"

          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            REMOTE_TAG_SHA="$(
              git ls-remote origin "refs/tags/${RELEASE_TAG}" |
              awk '{print $1}'
            )"
          fi

          if [[ -n "$REMOTE_TAG_SHA" ]]; then
            if [[ "$REMOTE_TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "Tag ${RELEASE_TAG} already exists on another commit."
              exit 1
            fi

            echo "Tag ${RELEASE_TAG} already exists on the correct commit."
            exit 0
          fi

          git tag \
            --annotate "$RELEASE_TAG" \
            --message "Release ${RELEASE_TAG}" \
            "$RELEASE_SHA"

          git push origin "$RELEASE_TAG"

      - name: Extract GitHub release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          awk -v version="$RELEASE_VERSION" '
            $0 == "## [" version "]" ||
            index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }

            found && /^## \[/ {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            printf 'Release v%s\n' "$RELEASE_VERSION" > release-notes.md
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CRATES_PUBLISHED: ${{ steps.crates.outputs.published }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "GitHub Release ${RELEASE_TAG} already exists."
            exit 0
          fi

          if [[ "$CRATES_PUBLISHED" == "true" ]]; then
            DISTRIBUTION_NOTE="Published successfully to crates.io."
          else
            DISTRIBUTION_NOTE="The crates.io publication did not succeed during this run. The GitHub release remains authoritative."
          fi

          {
            cat release-notes.md
            printf '\n---\n\n%s\n' "$DISTRIBUTION_NOTE"
          } > github-release-notes.md

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file github-release-notes.md \
            --verify-tag \
            artifacts/*.tar.gz

      - name: Create main to dev sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main dev

          if git merge-base --is-ancestor "$RELEASE_SHA" origin/dev; then
            echo "dev already contains ${RELEASE_TAG}."
            exit 0
          fi

          SYNC_BRANCH="sync/${RELEASE_TAG}-main-to-dev"

          EXISTING_PR="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base dev \
              --head "$SYNC_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Sync PR #${EXISTING_PR} already exists."

            gh pr merge "$EXISTING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --auto \
              --merge \
              --delete-branch

            exit 0
          fi

          if git ls-remote --exit-code \
            --heads origin "$SYNC_BRANCH" >/dev/null 2>&1
          then
            echo "Remote branch ${SYNC_BRANCH} already exists without an open PR."
            exit 1
          fi

          git switch --create "$SYNC_BRANCH" "$RELEASE_SHA"
          git push origin "$SYNC_BRANCH"

          PR_URL="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base dev \
              --head "$SYNC_BRANCH" \
              --title "Sync ${RELEASE_TAG} into dev" \
              --body "Synchronizes the complete ${RELEASE_TAG} GitHub release state from main back into dev."
          )"

          PR_NUMBER="${PR_URL##*/}"

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch
