name: Global Orchestrator

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - main

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/worker-ci.yml

  guard:
    name: Pre-merge guard
    needs: ci
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.head_ref != 'release/pending'
    permissions:
      contents: read
    uses: ./.github/workflows/worker-guard.yml

  main:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message != 'chore: release version bump' &&
      (!startsWith(github.event.head_commit.message, format('chore: release version bump{0}', fromJSON('"\n"'))))
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/main-orchestrator.yml
    secrets: inherit
