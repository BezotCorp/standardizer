name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate changelog version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "standardizer") | .version')"
          grep --fixed-strings "## [${version}]" CHANGELOG.md
      - run: cargo run --locked -p generate-routing
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p common --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p generate-routing --all-targets -- -D warnings
      - run: cargo clippy --locked -p standardizer --all-targets -- -D warnings
      - run: cargo clippy --locked -p standardizer --all-targets --no-default-features --features embedded-routing -- -D warnings
      - run: cargo test --locked -p common --all-features
      - run: cargo test --locked -p generate-routing
      - run: cargo test --locked -p standardizer
      - uses: actions/upload-artifact@v4
        with:
          name: routing-data
          path: data/standardizer/routing.bin
          if-no-files-found: error
