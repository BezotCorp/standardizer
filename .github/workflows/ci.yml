name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo run --locked -p generate-routing
      - name: Check routing.bin is up to date
        run: git diff --exit-code -- product/data/routing.bin
      - run: cargo run --locked -p standardizer -- check
      - run: cargo clippy --locked -p standardizer-common --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p generate-routing --all-targets -- -D warnings
      - run: cargo clippy --locked -p standardizer --all-targets -- -D warnings
      - run: cargo clippy --locked -p standardizer --all-targets --no-default-features --features routing-source -- -D warnings
      - run: cargo test --locked -p standardizer-common --all-features
      - run: cargo test --locked -p generate-routing
      - run: bash scripts/test-integration.sh
      - run: cargo publish --dry-run --locked --allow-dirty -p standardizer-common -p standardizer
